<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfomily — Family Wealth Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:        #0d1117;
  --bg2:       #161b22;
  --bg3:       #1c2128;
  --bg4:       #21262d;
  --border:    #30363d;
  --text:      #e6edf3;
  --text2:     #8b949e;
  --text3:     #6e7681;
  --gold:      #d4af37;
  --gold2:     #e8c84a;
  --green:     #3fb950;
  --red:       #f85149;
  --blue:      #58a6ff;
  --purple:    #bc8cff;
  --orange:    #ffa657;
  --sidebar-w: 240px;
  --radius:    8px;
  --radius-lg: 14px;
  --font-d:    'Playfair Display', Georgia, serif;
  --font-b:    'IBM Plex Sans', system-ui, sans-serif;
  --font-m:    'IBM Plex Mono', 'Courier New', monospace;
  --transition: 0.18s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-b);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
}
a { color: var(--gold); text-decoration: none; }
input, select, textarea, button { font-family: inherit; font-size: inherit; }

/* Typography */
h1, h2, h3 { font-family: var(--font-d); font-weight: 600; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
.mono { font-family: var(--font-m); }
.text-gold  { color: var(--gold); }
.text-green { color: var(--green); }
.text-red   { color: var(--red); }
.text-muted { color: var(--text3); }
.text-secondary { color: var(--text2); }
.text-sm  { font-size: 0.8rem; }
.text-xs  { font-size: 0.72rem; }
.text-lg  { font-size: 1.1rem; }
.bold     { font-weight: 600; }
.italic   { font-style: italic; }
.text-center { text-align: center; }
.mb-1 { margin-bottom: 4px; }
.mb-2 { margin-bottom: 8px; }
.mb-3 { margin-bottom: 16px; }
.mb-4 { margin-bottom: 24px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 16px; }

/* Layout */
.app-shell {
display: flex;
height: 100vh;
overflow: hidden;
}
#sidebar {
width: var(--sidebar-w);
min-width: var(--sidebar-w);
background: var(--bg2);
border-right: 1px solid var(--border);
display: flex;
flex-direction: column;
overflow-y: auto;
overflow-x: hidden;
}
#main {
flex: 1;
overflow-y: auto;
background: var(--bg);
padding: 24px;
}

/* Sidebar */
.sidebar-brand {
padding: 18px 16px 12px;
border-bottom: 1px solid var(--border);
}
.sidebar-brand .brand-title {
font-family: var(--font-d);
font-size: 1rem;
font-weight: 700;
color: var(--gold);
line-height: 1.2;
}
.sidebar-brand .brand-sub {
font-size: 0.7rem;
color: var(--text3);
margin-top: 2px;
}
.sidebar-brand .brand-version {
font-size: 0.62rem;
color: var(--text3);
margin-top: 4px;
opacity: 0.7;
font-family: var(--font-m);
letter-spacing: 0.02em;
}
.sidebar-section-label {
font-size: 0.65rem;
font-weight: 600;
letter-spacing: 0.08em;
text-transform: uppercase;
color: var(--text3);
padding: 14px 16px 6px;
}
.member-list { padding: 0 8px; }
.member-item {
display: flex;
align-items: center;
gap: 8px;
padding: 7px 8px;
border-radius: var(--radius);
cursor: pointer;
transition: background var(--transition);
position: relative;
}
.member-item:hover { background: var(--bg4); }
.member-item.active { background: var(--bg4); }
.member-item.active::before {
content: ‘’;
position: absolute;
left: 0; top: 20%; bottom: 20%;
width: 3px;
border-radius: 0 2px 2px 0;
background: var(--gold);
}
.member-avatar {
width: 30px; height: 30px;
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-weight: 700; font-size: 0.75rem;
color: #0d1117;
flex-shrink: 0;
}
.member-info { flex: 1; min-width: 0; }
.member-name { font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.member-nw   { font-size: 0.7rem; color: var(--text3); font-family: var(--font-m); }
.member-edit-btn {
opacity: 0;
background: none; border: none;
color: var(--text3); cursor: pointer;
padding: 2px 4px; border-radius: 4px;
transition: opacity var(--transition), color var(--transition);
font-size: 0.8rem;
flex-shrink: 0;
}
.member-item:hover .member-edit-btn { opacity: 1; }
.member-edit-btn:hover { color: var(--gold); }

/* Nav */
.nav-list { padding: 4px 8px; }
.nav-item {
display: flex; align-items: center; gap: 8px;
padding: 7px 8px;
border-radius: var(--radius);
cursor: pointer;
font-size: 0.82rem;
color: var(--text2);
transition: background var(--transition), color var(--transition);
user-select: none;
}
.nav-item:hover { background: var(--bg4); color: var(--text); }
.nav-item.active { background: var(--bg4); color: var(--gold); }
.nav-icon { width: 16px; text-align: center; flex-shrink: 0; }

.sidebar-footer {
margin-top: auto;
border-top: 1px solid var(--border);
padding: 8px;
display: flex; flex-direction: column; gap: 2px;
}

/* Buttons */
.btn {
display: inline-flex; align-items: center; justify-content: center; gap: 6px;
padding: 6px 14px;
border-radius: var(--radius);
border: 1px solid transparent;
cursor: pointer;
font-size: 0.82rem;
font-weight: 500;
transition: background var(--transition), color var(--transition), border-color var(--transition);
white-space: nowrap;
}
.btn-primary {
background: var(--gold); color: #0d1117; border-color: var(--gold);
}
.btn-primary:hover { background: var(--gold2); border-color: var(--gold2); }
.btn-ghost {
background: transparent; color: var(--text2); border-color: var(--border);
}
.btn-ghost:hover { background: var(--bg4); color: var(--text); border-color: var(--text3); }
.btn-danger {
background: transparent; color: var(--red); border-color: transparent;
}
.btn-danger:hover { background: rgba(248,81,73,0.1); border-color: var(--red); }
.btn-icon {
padding: 4px 7px; font-size: 0.8rem; min-width: 28px;
background: transparent; color: var(--text3); border-color: transparent;
}
.btn-icon:hover { background: var(--bg4); color: var(--text); }
.btn-gold-ghost {
background: transparent; color: var(--gold); border-color: var(--gold);
}
.btn-gold-ghost:hover { background: rgba(212,175,55,0.12); }
.btn-sm { padding: 4px 10px; font-size: 0.75rem; }
.btn-full { width: 100%; }
.btn-sidebar {
width: 100%;
justify-content: flex-start;
padding: 7px 8px;
gap: 8px;
background: transparent; color: var(--text2); border: none;
border-radius: var(--radius);
font-size: 0.82rem;
}
.btn-sidebar:hover { background: var(--bg4); color: var(--text); }
.btn-sidebar .nav-icon { width: 16px; }

/* Cards */
.card {
background: var(--bg3);
border: 1px solid var(--border);
border-radius: var(--radius-lg);
padding: 20px;
}
.card-sm { padding: 14px 16px; }
.card-header {
display: flex; align-items: center; justify-content: space-between;
margin-bottom: 16px;
}
.card-title { font-family: var(--font-d); font-size: 0.95rem; font-weight: 600; }
.stats-row {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
gap: 12px;
margin-bottom: 20px;
}
.stat-card {
background: var(--bg3);
border: 1px solid var(--border);
border-radius: var(--radius-lg);
padding: 16px;
min-width: 0;
overflow: hidden;
}
.stat-label { font-size: 0.72rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.stat-value { font-family: var(--font-m); font-size: 1.25rem; font-weight: 500; color: var(--text); word-break: break-word; overflow-wrap: anywhere; line-height: 1.2; }
.stat-value.big { font-size: 1.6rem; color: var(--gold); }
.stat-sub { font-size: 0.7rem; color: var(--text3); margin-top: 4px; }

/* Section header */
.view-header {
display: flex; align-items: center; justify-content: space-between;
margin-bottom: 20px;
padding-bottom: 14px;
border-bottom: 1px solid var(--border);
}
.view-title { font-family: var(--font-d); font-size: 1.4rem; }
.view-actions { display: flex; gap: 8px; align-items: center; }

/* Table */
.table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border); }
.holdings-table {
width: 100%; border-collapse: collapse;
font-size: 0.82rem;
}
.holdings-table thead { background: var(--bg3); }
.holdings-table th {
padding: 10px 12px;
text-align: left;
font-weight: 600; font-size: 0.72rem;
text-transform: uppercase; letter-spacing: 0.05em;
color: var(--text3);
border-bottom: 1px solid var(--border);
white-space: nowrap;
}
.holdings-table td {
padding: 10px 12px;
border-bottom: 1px solid var(--border);
vertical-align: middle;
}
.holdings-table tbody tr:last-child td { border-bottom: none; }
.holdings-table tbody tr { background: var(--bg); transition: background var(--transition); }
.holdings-table tbody tr:hover { background: var(--bg3); }
.holdings-table .num { text-align: right; font-family: var(--font-m); }
.holdings-table .actions { text-align: right; white-space: nowrap; }
.ticker-badge {
display: inline-block;
background: var(--bg4); border: 1px solid var(--border);
border-radius: 4px; padding: 2px 6px;
font-family: var(--font-m); font-size: 0.72rem;
color: var(--gold); font-weight: 500;
}
.ccy-badge {
display: inline-block;
background: var(--bg4); border: 1px solid var(--border);
border-radius: 4px; padding: 1px 5px;
font-size: 0.68rem; color: var(--text2);
}
.broker-badge {
display: inline-block;
background: rgba(88, 166, 255, 0.12);
border: 1px solid rgba(88, 166, 255, 0.3);
color: var(--blue);
border-radius: 4px; padding: 2px 7px;
font-size: 0.7rem; font-weight: 500;
white-space: nowrap;
}
.freq-badge {
display: inline-block;
border-radius: 4px; padding: 2px 8px;
font-size: 0.7rem; font-weight: 500;
white-space: nowrap;
}
.freq-recurring {
background: rgba(224, 85, 85, 0.12);
border: 1px solid rgba(224, 85, 85, 0.3);
color: var(--red);
}
.freq-onetime {
background: rgba(139, 148, 158, 0.12);
border: 1px solid rgba(139, 148, 158, 0.3);
color: var(--text2);
}
.alloc-toggle {
display: inline-flex;
background: var(--bg3);
border: 1px solid var(--border);
border-radius: 6px;
padding: 2px;
gap: 2px;
}
.alloc-toggle-btn {
background: none;
border: none;
color: var(--text2);
padding: 4px 12px;
font-size: 0.72rem;
font-family: inherit;
font-weight: 500;
cursor: pointer;
border-radius: 4px;
text-transform: uppercase;
letter-spacing: 0.04em;
transition: all 0.15s ease;
}
.alloc-toggle-btn:hover { color: var(--text); }
.alloc-toggle-btn.active {
background: var(--gold);
color: var(--bg);
}

/* FIRE progress stat card with dual columns (Liquid vs Total) */
.fire-stat-dual { padding: 14px 16px; }
.fire-dual-row {
display: grid;
grid-template-columns: 1fr 1px 1fr;
gap: 10px;
align-items: stretch;
margin: 8px 0 6px;
}
.fire-dual-col {
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
gap: 2px;
}
.fire-dual-label {
font-size: 0.65rem;
color: var(--text3);
text-transform: uppercase;
letter-spacing: 0.05em;
font-weight: 600;
}
.fire-dual-value {
font-family: var(--font-m);
font-size: 1.3rem;
font-weight: 600;
line-height: 1.1;
}
.fire-dual-divider {
background: var(--border);
width: 1px;
align-self: stretch;
}

/* Focus cards — dual-column top-of-dashboard summary */
.focus-row {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 14px;
}
.focus-card {
background: linear-gradient(145deg, var(--bg3), var(--bg2));
border: 1px solid var(--border);
border-radius: var(--radius-lg);
padding: 20px;
position: relative;
overflow: hidden;
}
.focus-card::before {
content: ‘’;
position: absolute;
top: 0; left: 0; right: 0;
height: 3px;
}
.focus-liquid::before { background: linear-gradient(90deg, #ffa657, #d4af37); }
.focus-net::before    { background: linear-gradient(90deg, #58a6ff, #3fb950); }
.focus-label {
font-size: 0.72rem;
color: var(--text3);
text-transform: uppercase;
letter-spacing: 0.08em;
margin-bottom: 10px;
display: flex;
align-items: center;
gap: 6px;
}
.focus-value {
font-family: var(--font-d);
font-size: 1.9rem;
font-weight: 600;
color: var(--gold);
line-height: 1.15;
word-break: break-word;
overflow-wrap: anywhere;
}
.focus-net .focus-value { color: #58a6ff; }
.focus-sub {
font-size: 0.74rem;
color: var(--text3);
margin-top: 6px;
margin-bottom: 14px;
}
.focus-breakdown {
display: flex;
flex-direction: column;
gap: 5px;
padding-top: 12px;
border-top: 1px solid var(--border);
font-size: 0.75rem;
color: var(--text2);
}
.focus-breakdown > div {
display: flex;
align-items: center;
gap: 8px;
word-break: break-word;
}
.focus-breakdown .dot {
display: inline-block;
width: 8px; height: 8px;
border-radius: 50%;
flex-shrink: 0;
}
@media (max-width: 700px) {
.focus-row { grid-template-columns: 1fr; }
.focus-value { font-size: 1.5rem; }
.focus-card { padding: 16px; }
}
.filter-note {
font-size: 0.75rem; color: var(--text2);
padding: 6px 10px; background: rgba(212,175,55,0.06);
border: 1px solid rgba(212,175,55,0.2);
border-radius: 6px; margin-bottom: 10px;
display: flex; align-items: center; gap: 10px;
}
.btn-link-inline {
background: none; border: none; color: var(--gold);
text-decoration: underline; cursor: pointer;
font-size: 0.75rem; padding: 0; font-family: inherit;
}
.form-select-sm { padding: 4px 8px !important; font-size: 0.78rem !important; height: auto !important; }
.table-toolbar {
display: flex; align-items: center; gap: 8px;
margin-bottom: 12px; flex-wrap: wrap;
}
.refresh-note { font-size: 0.7rem; color: var(--text3); margin-left: auto; }

/* Forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.full { grid-column: 1 / -1; }
.form-label {
font-size: 0.75rem; font-weight: 600; color: var(--text2);
display: flex; align-items: center; gap: 5px;
}
.form-input, .form-select {
background: var(--bg2); border: 1px solid var(--border);
color: var(--text); border-radius: var(--radius);
padding: 8px 10px; width: 100%;
transition: border-color var(--transition);
}
.form-input:focus, .form-select:focus {
outline: none; border-color: var(--gold);
}
.form-input::placeholder { color: var(--text3); }
textarea.form-input { resize: vertical; min-height: 80px; }
.form-section-title {
font-family: var(--font-d); font-size: 0.85rem; font-weight: 600;
color: var(--gold); padding: 10px 0 4px;
border-top: 1px solid var(--border); margin-top: 4px;
}

/* Modals */
#modal-backdrop {
display: none;
position: fixed; inset: 0;
background: rgba(0,0,0,0.7);
z-index: 1000;
align-items: center; justify-content: center;
padding: 20px;
}
#modal-backdrop.open { display: flex; }
#modal-container {
background: var(--bg2);
border: 1px solid var(--border);
border-radius: var(--radius-lg);
width: 100%; max-width: 560px;
max-height: 90vh;
display: flex; flex-direction: column;
box-shadow: 0 24px 48px rgba(0,0,0,0.5);
}
.modal-header {
display: flex; align-items: center; justify-content: space-between;
padding: 16px 20px;
border-bottom: 1px solid var(--border);
flex-shrink: 0;
}
.modal-title { font-family: var(--font-d); font-size: 1.1rem; }
.modal-close {
background: none; border: none; color: var(--text3);
cursor: pointer; font-size: 1.2rem; padding: 2px 6px;
border-radius: 4px; transition: color var(--transition);
}
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer {
display: flex; justify-content: flex-end; gap: 8px;
padding: 14px 20px;
border-top: 1px solid var(--border);
flex-shrink: 0;
}

/* Wizard */
#wizard-overlay {
display: none;
position: fixed; inset: 0;
background: rgba(13,17,23,0.95);
z-index: 2000;
align-items: center; justify-content: center;
padding: 20px;
}
#wizard-overlay.open { display: flex; }
.wizard-container {
background: var(--bg2);
border: 1px solid var(--border);
border-radius: var(--radius-lg);
width: 100%; max-width: 580px;
box-shadow: 0 32px 64px rgba(0,0,0,0.6);
display: flex; flex-direction: column;
overflow: hidden;
}
.wizard-top {
background: linear-gradient(135deg, #1a1f2e 0%, #1c2128 100%);
padding: 32px 32px 24px;
border-bottom: 1px solid var(--border);
}
.wizard-step-num {
font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em;
text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
.wizard-step-title { font-family: var(--font-d); font-size: 1.6rem; margin-bottom: 8px; }
.wizard-step-desc { color: var(--text2); font-size: 0.88rem; line-height: 1.6; }
.wizard-body { padding: 24px 32px; min-height: 160px; }
.wizard-footer {
display: flex; align-items: center; justify-content: space-between;
padding: 16px 32px;
border-top: 1px solid var(--border);
background: var(--bg3);
}
.wizard-dots { display: flex; gap: 8px; }
.wizard-dot {
width: 8px; height: 8px; border-radius: 50%;
background: var(--border); cursor: pointer;
transition: background var(--transition), transform var(--transition);
}
.wizard-dot.active { background: var(--gold); transform: scale(1.25); }
.wizard-dot.done { background: var(--green); }
.wizard-buttons { display: flex; gap: 8px; }

/* Tooltips (CSS-only) */
.tip-wrap {
position: relative; display: inline-flex;
align-items: center; vertical-align: middle;
}
.tip-badge {
display: inline-flex; align-items: center; justify-content: center;
width: 15px; height: 15px; border-radius: 50%;
background: var(--bg4); border: 1px solid var(--border);
color: var(--text3); font-size: 0.6rem; font-weight: 700;
cursor: help; margin-left: 4px;
}
.tip-box {
display: none;
position: absolute;
top: calc(100% + 6px);
left: 0;
background: var(--bg4);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 8px 12px;
font-size: 0.75rem; line-height: 1.5;
color: var(--text2);
width: 260px; max-width: 80vw;
z-index: 9999;
pointer-events: none;
box-shadow: 0 8px 24px rgba(0,0,0,0.5);
white-space: normal;
}
.tip-wrap { position: relative; }
.tip-wrap:hover .tip-box, .tip-wrap:focus-within .tip-box { display: block; }

/* Hint banners */
.hint-banner {
display: flex; align-items: flex-start; gap: 12px;
background: rgba(212,175,55,0.07);
border: 1px solid rgba(212,175,55,0.25);
border-left: 3px solid var(--gold);
border-radius: var(--radius);
padding: 12px 14px;
margin-bottom: 16px;
font-size: 0.82rem;
}
.hint-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
.hint-content { flex: 1; }
.hint-text { color: var(--text2); line-height: 1.5; }
.hint-actions { margin-top: 8px; display: flex; gap: 8px; }
.hint-dismiss {
background: none; border: none; color: var(--text3);
cursor: pointer; font-size: 1rem; padding: 0;
flex-shrink: 0; margin-top: 1px;
transition: color var(--transition);
}
.hint-dismiss:hover { color: var(--text); }

/* Empty states */
.empty-state {
display: flex; flex-direction: column; align-items: center;
justify-content: center; text-align: center;
padding: 60px 20px;
color: var(--text3);
}
.empty-icon { font-size: 2.8rem; margin-bottom: 16px; opacity: 0.6; }
.empty-title { font-family: var(--font-d); font-size: 1.1rem; color: var(--text2); margin-bottom: 8px; }
.empty-msg { font-size: 0.82rem; color: var(--text3); max-width: 300px; line-height: 1.6; margin-bottom: 20px; }

/* FX Panel */
.fx-panel {
background: var(--bg3);
border: 1px solid var(--border);
border-radius: var(--radius-lg);
padding: 16px 20px;
margin-bottom: 20px;
}
.fx-panel-header {
display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
}
.fx-panel-title { font-size: 0.82rem; font-weight: 600; color: var(--text2); }
.fx-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
gap: 10px;
}
.fx-item label { font-size: 0.7rem; color: var(--text3); display: block; margin-bottom: 4px; font-weight: 600; }
.fx-input {
background: var(--bg2); border: 1px solid var(--border);
color: var(--text); border-radius: var(--radius);
padding: 6px 8px; width: 100%;
font-family: var(--font-m); font-size: 0.8rem;
transition: border-color var(--transition);
}
.fx-input:focus { outline: none; border-color: var(--gold); }

/* FIRE */
.fire-bar-wrap { margin: 16px 0; }
.fire-bar-label {
display: flex; justify-content: space-between;
font-size: 0.72rem; color: var(--text3); margin-bottom: 6px;
}
.fire-bar-track {
height: 10px; background: var(--bg4);
border-radius: 5px; overflow: hidden;
}
.fire-bar-fill {
height: 100%; border-radius: 5px;
background: linear-gradient(90deg, var(--gold), var(--green));

}
.fire-stats {
display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
gap: 12px; margin-top: 20px;

.fire-stat { background: var(--bg4); border-radius: var(--radius); padding: 12px; }

/* Charts */
.chart-wrap { position: relative; }
.chart-wrap canvas { max-height: 320px; }

/* History */
.snapshot-list { display: flex; flex-direction: column; gap: 10px; }
.snapshot-card {
background: var(--bg3);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 14px 16px;
display: flex; align-items: center; gap: 14px;
}
.snapshot-date { font-family: var(--font-m); font-size: 0.75rem; color: var(--text3); min-width: 90px; }
.snapshot-label { font-size: 0.85rem; font-weight: 500; flex: 1; }
.snapshot-members { display: flex; flex-wrap: wrap; gap: 6px; }
.snapshot-chip {
background: var(--bg4); border-radius: 4px;
padding: 2px 8px; font-size: 0.72rem;
font-family: var(--font-m); color: var(--text2);
}

/* Toast */
#toast-container {
position: fixed; bottom: 24px; right: 24px;
display: flex; flex-direction: column; gap: 8px;
z-index: 3000; pointer-events: none;
}
.toast {
background: var(--bg3); border: 1px solid var(--border);
border-radius: var(--radius); padding: 10px 16px;
font-size: 0.82rem; color: var(--text);
box-shadow: 0 8px 24px rgba(0,0,0,0.4);
display: flex; align-items: center; gap: 8px;
animation: toastIn 0.25s ease;
pointer-events: auto;
}
.toast.success { border-left: 3px solid var(--green); }
.toast.error   { border-left: 3px solid var(--red); }
.toast.info    { border-left: 3px solid var(--blue); }
@keyframes toastIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; animation: spin 1.1s linear infinite; }

/* Misc */
.divider { height: 1px; background: var(--border); margin: 12px 0; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.section-gap { margin-bottom: 24px; }
.pnl-pos { color: var(--green); }
.pnl-neg { color: var(--red); }
.member-no-select .member-edit-btn { display: none; }

/* Responsive */
@media (max-width: 768px) {
#sidebar { width: 200px; min-width: 200px; }
.form-grid, .form-grid-3 { grid-template-columns: 1fr; }
.stats-row { grid-template-columns: 1fr 1fr; }

/* Mobile top bar — sticky inside #main */

<script>
'use strict';
// ═══════════════════════════════════════════════
// ── CONSTANTS ─────────────────────────────────
const PFX = 'fwt_clean_';
const APP_VERSION = '1.0.1';
const APP_VERSION_DATE = '24 Apr 2026';
const MEMBER_COLORS = ['#d4af37','#58a6ff','#3fb950','#bc8cff','#ffa657','#f85149','#39c5cf','#ff9de2'];
const CURRENCIES = ['SGD','USD','HKD','EUR','GBP','AUD','JPY'];
const CCY_SYM = {SGD:'S$',USD:'$',HKD:'HK$',EUR:'€',GBP:'£',AUD:'A$',JPY:'¥'};
const CCY_LABEL = {SGD:'SGD (Singapore Dollar)',USD:'USD (US Dollar)',HKD:'HKD (Hong Kong Dollar)',EUR:'EUR (Euro)',GBP:'GBP (British Pound)',AUD:'AUD (Australian Dollar)',JPY:'JPY (Japanese Yen)'};
const DEFAULT_FX = {USD:1.27,HKD:0.164,EUR:1.49,GBP:1.72,AUD:0.91,JPY:0.0080};
const CHART_COLORS = {sgx:'#d4af37',us:'#58a6ff',other:'#bc8cff',cpf:'#3fb950',cash:'#ffa657',other_assets:'#8b949e',liabilities:'#f85149'};

// ── STATE ─────────────────────────────────────
const STATE = {
  members: [],
  fxRates: {...DEFAULT_FX},
  history: [],
  settings: {wizardCompleted: false},
  ui: {activeMemberId: null, activeView: 'dashboard', brokerFilter: {sgx:'', us:'', other:''}, allocMode: 'gross'}
};

// Common broker list — users can also type custom values
const COMMON_BROKERS = [
  'DBS Vickers','UOB Kay Hian','OCBC Securities','Phillip (POEMS)','CGS-CIMB','Maybank KE',
  'IBKR','Tiger Brokers','Moomoo','Webull','Saxo','FSMOne','Endowus','Syfe','StashAway',
  'Standard Chartered','HSBC','CITIC','Futu','Robinhood','Fidelity','Vanguard','Schwab'
];
let _dismissedHints = [];
const _charts = {allocation:null, history:null, family:null};
let _wizardStep = 1;
let _modalSubmitFn = null;
const _debounceTimers = {};

// ── STORAGE ───────────────────────────────────
function _safeSet(key, value) {
  try {
    localStorage.setItem(PFX + key, JSON.stringify(value));
    return true;
  } catch(e) {
    console.warn('Save failed for ' + key, e);
    if (typeof showToast === 'function') showToast('⚠ Could not save to local storage. Use Export to back up data.', 'error');
    return false;
  }
}
function saveMembers()  { _safeSet('members',  STATE.members); }
function saveFxRates()  { _safeSet('fxRates',  STATE.fxRates); }
function saveHistory()  { _safeSet('history',  STATE.history); }
function saveSettings() { _safeSet('settings', STATE.settings); }
function saveDismissedHints() { _safeSet('hints', _dismissedHints); }

function exportData() {
  const payload = {
    version: 2,
    exportedAt: new Date().toISOString(),
    appName: 'Portfomily',
    members: STATE.members,
    fxRates: STATE.fxRates,
    history: STATE.history,
    settings: STATE.settings,
    dismissedHints: _dismissedHints,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `portfomily-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded', 'success');
}

function migrateMemberData(m) {
  // Ensure all members have the required arrays/fields (backward compat with older backups)
  if (!Array.isArray(m.properties)) m.properties = [];
  if (!Array.isArray(m.sgxHoldings)) m.sgxHoldings = [];
  if (!Array.isArray(m.usHoldings)) m.usHoldings = [];
  if (!Array.isArray(m.otherHoldings)) m.otherHoldings = [];
  if (!m.cpf) m.cpf = {oa:0, sa:0, ma:0};
  if (m.srs == null) m.srs = 0;
  if (m.cash == null) m.cash = 0;
  if (!Array.isArray(m.cashAccounts)) m.cashAccounts = [];
  if (!Array.isArray(m.expenses)) m.expenses = [];
  if (m.otherAssets == null) m.otherAssets = 0;
  if (m.liabilities == null) m.liabilities = 0;
  if (m.fireAnnualExpense == null) m.fireAnnualExpense = 0;
  if (m.fireReturnRate == null) m.fireReturnRate = 4;
  // Each holding should have broker field (default blank)
  ['sgxHoldings','usHoldings','otherHoldings'].forEach(k => {
    m[k].forEach(h => { if (h.broker == null) h.broker = ''; });
  });
  // Each property should have id + type default
  m.properties.forEach(p => {
    if (!p.id) p.id = uid();
    if (!p.type) p.type = 'investment';
    if (p.ownershipPct == null) p.ownershipPct = 100;
  });
  return m;
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = async () => {
    const file = input.files?.[0]; if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.members || !Array.isArray(data.members)) throw new Error('Invalid backup format — missing members array');
      const backupVersion = data.version || 1;
      const memberCount = data.members.length;
      confirmModal(`Import ${memberCount} member${memberCount!==1?'s':''} from backup (v${backupVersion})? This will REPLACE your current data.<br><br><span class="text-muted text-xs">Older backups are automatically upgraded to the latest format.</span>`, () => {
        // Migrate each member to current schema
        STATE.members = data.members.map(migrateMemberData);
        if (data.fxRates) STATE.fxRates = {...DEFAULT_FX, ...data.fxRates};
        if (data.history) STATE.history = data.history;
        if (data.settings) STATE.settings = {...STATE.settings, ...data.settings};
        if (data.dismissedHints) _dismissedHints = data.dismissedHints;
        if (STATE.members[0]) STATE.ui.activeMemberId = STATE.members[0].id;
        saveMembers(); saveFxRates(); saveHistory(); saveSettings(); saveDismissedHints();
        closeModal();
        renderAll();
        const upgradeMsg = backupVersion < 2 ? ' (upgraded from v' + backupVersion + ' — property & broker fields added)' : '';
        showToast('✓ Imported ' + memberCount + ' member' + (memberCount!==1?'s':'') + upgradeMsg, 'success');
      });
    } catch(e) {
      showToast('Import failed: ' + e.message, 'error');
    }
  };
  input.click();
}

function loadState() {
  try {
    const m = localStorage.getItem(PFX+'members');
    if (m) STATE.members = JSON.parse(m).map(migrateMemberData);
  } catch(e) {}
  try {
    const f = localStorage.getItem(PFX+'fxRates');
    if (f) STATE.fxRates = {...DEFAULT_FX, ...JSON.parse(f)};
  } catch(e) {}
  try {
    const h = localStorage.getItem(PFX+'history');
    if (h) STATE.history = JSON.parse(h);
  } catch(e) {}
  try {
    const s = localStorage.getItem(PFX+'settings');
    if (s) STATE.settings = {...STATE.settings, ...JSON.parse(s)};
  } catch(e) {}
  try {
    const d = localStorage.getItem(PFX+'hints');
    if (d) _dismissedHints = JSON.parse(d);
  } catch(e) {}
  // set active member
  if (STATE.members.length > 0) {
    const saved = STATE.settings.activeMemberId;
    const found = saved && STATE.members.find(m => m.id === saved);
    STATE.ui.activeMemberId = found ? saved : STATE.members[0].id;
  }
}

// ── CRUD: MEMBERS ────────────────────────────
function uid() {
  return (typeof crypto !== 'undefined' && crypto.randomUUID)
    ? crypto.randomUUID()
    : Math.random().toString(36).slice(2) + Date.now().toString(36);
}
function pickColor(index) { return MEMBER_COLORS[index % MEMBER_COLORS.length]; }

function memberDefaults(data) {
  return {
    id: uid(),
    name: 'New Member',
    color: pickColor(STATE.members.length),
    cpf: {oa:0, sa:0, ma:0},
    srs: 0,
    cash: 0,
    cashAccounts: [],
    expenses: [],
    otherAssets: 0,
    liabilities: 0,
    fireAnnualExpense: 0,
    fireReturnRate: 4,
    sgxHoldings: [],
    usHoldings: [],
    otherHoldings: [],
    properties: [],
    ...data
  };
}

function addMember(data) {
  const m = memberDefaults(data);
  STATE.members.push(m);
  STATE.ui.activeMemberId = m.id;
  STATE.settings.activeMemberId = m.id;
  saveMembers(); saveSettings();
  return m;
}
function updateMember(id, data) {
  const i = STATE.members.findIndex(m => m.id === id);
  if (i < 0) return;
  STATE.members[i] = {...STATE.members[i], ...data};
  if (data.cpf) STATE.members[i].cpf = {...STATE.members[i].cpf, ...data.cpf};
  saveMembers();
}
function deleteMember(id) {
  STATE.members = STATE.members.filter(m => m.id !== id);
  if (STATE.ui.activeMemberId === id) {
    STATE.ui.activeMemberId = STATE.members.length > 0 ? STATE.members[0].id : null;
    STATE.settings.activeMemberId = STATE.ui.activeMemberId;
  }
  saveMembers(); saveSettings();
}

// ── CRUD: HOLDINGS ────────────────────────────
function holdingDefaults(type, data) {
  const base = {id:uid(), ticker:'', name:'', broker:'', shares:0, avgCost:0, currentPrice:0, lastRefreshed:null, ...data};
  if (type === 'other') base.currency = data.currency || 'USD';
  return base;
}
function getActiveMember() {
  return STATE.members.find(m => m.id === STATE.ui.activeMemberId) || null;
}
function getMember(id) { return STATE.members.find(m => m.id === id) || null; }
function holdingsKey(type) { return type+'Holdings'; }

function addHolding(type, data) {
  const m = getActiveMember(); if (!m) return;
  m[holdingsKey(type)].push(holdingDefaults(type, data));
  saveMembers();
}
function updateHolding(type, id, data) {
  const m = getActiveMember(); if (!m) return;
  const arr = m[holdingsKey(type)];
  const i = arr.findIndex(h => h.id === id); if (i < 0) return;
  arr[i] = {...arr[i], ...data};
  saveMembers();
}
function deleteHolding(type, id) {
  const m = getActiveMember(); if (!m) return;
  m[holdingsKey(type)] = m[holdingsKey(type)].filter(h => h.id !== id);
  saveMembers();
}

// ── COMPUTED ──────────────────────────────────
function toSGD(amount, currency) {
  if (!currency || currency === 'SGD') return amount;
  return amount * (STATE.fxRates[currency] || 1);
}

function holdingCurrency(h, type) {
  if (type === 'sgx') return 'SGD';
  if (type === 'us')  return 'USD';
  return h.currency || 'USD';
}

function computeHolding(h, type) {
  const ccy = holdingCurrency(h, type);
  const price = h.currentPrice > 0 ? h.currentPrice : h.avgCost;
  const valueSGD  = toSGD(h.shares * price, ccy);
  const costSGD   = toSGD(h.shares * h.avgCost, ccy);
  const pnlSGD    = valueSGD - costSGD;
  const pnlPct    = costSGD > 0 ? (pnlSGD / costSGD * 100) : 0;
  return {valueSGD, costSGD, pnlSGD, pnlPct, ccy, price};
}

function computeProperties(m) {
  const props = (m.properties || []).map(p => {
    const share = (p.ownershipPct != null ? p.ownershipPct : 100) / 100;
    const grossValue = p.value || 0;
    const grossMortgage = p.mortgage || 0;
    const userValue = grossValue * share;
    const userMortgage = grossMortgage * share;
    const equity = userValue - userMortgage;
    const rental = (p.monthlyRental || 0) * share;
    const mtgPayment = (p.monthlyMortgage || 0) * share;
    const otherCosts = (p.monthlyCosts || 0) * share;
    const netCashFlow = rental - mtgPayment - otherCosts;
    return {
      ...p,
      share, userValue, userMortgage, equity,
      rental, mtgPayment, otherCosts, netCashFlow
    };
  });
  const totalValue     = props.reduce((s,p) => s + p.userValue, 0);
  const totalMortgage  = props.reduce((s,p) => s + p.userMortgage, 0);
  const totalEquity    = props.reduce((s,p) => s + p.equity, 0);
  const totalRental    = props.reduce((s,p) => s + p.rental, 0);
  const totalMtgPay    = props.reduce((s,p) => s + p.mtgPayment, 0);
  const totalCosts     = props.reduce((s,p) => s + p.otherCosts, 0);
  const totalCashFlow  = props.reduce((s,p) => s + p.netCashFlow, 0);
  // Investment properties only (for FIRE post-sale calculations)
  const investmentOnly = props.filter(p => p.type !== 'primary');
  const investmentEquity = investmentOnly.reduce((s,p) => s + p.equity, 0);
  const primaryEquity    = props.filter(p => p.type === 'primary').reduce((s,p) => s + p.equity, 0);
  return {
    props, totalValue, totalMortgage, totalEquity,
    totalRental, totalMtgPay, totalCosts, totalCashFlow,
    investmentEquity, primaryEquity
  };
}

function computeCashTotal(m) {
  if (!m) return 0;
  // If the user is using the cashAccounts array, sum those. Otherwise fall back to the single m.cash number.
  if (Array.isArray(m.cashAccounts) && m.cashAccounts.length > 0) {
    return m.cashAccounts.reduce((s, a) => s + (parseFloat(a.balance)||0), 0);
  }
  return parseFloat(m.cash)||0;
}

// Convert an expense entry to a monthly-equivalent SGD amount (for recurring only)
function expenseMonthlyAmount(e) {
  const amt = parseFloat(e.amount) || 0;
  switch (e.frequency) {
    case 'daily':    return amt * 30.4375;
    case 'weekly':   return amt * 4.345;
    case 'monthly':  return amt;
    case 'yearly':   return amt / 12;
    case 'one-time':
    default:         return 0;  // one-time doesn't contribute to monthly recurring
  }
}
function expenseAnnualAmount(e) {
  const amt = parseFloat(e.amount) || 0;
  switch (e.frequency) {
    case 'daily':    return amt * 365.25;
    case 'weekly':   return amt * 52.14;
    case 'monthly':  return amt * 12;
    case 'yearly':   return amt;
    case 'one-time':
    default:         return amt;  // one-time counted once
  }
}
function computeExpenses(m) {
  const list = (m?.expenses)||[];
  const recurring = list.filter(e => e.frequency && e.frequency !== 'one-time');
  const oneTime   = list.filter(e => !e.frequency || e.frequency === 'one-time');
  const monthlyRecurring = recurring.reduce((s,e) => s + expenseMonthlyAmount(e), 0);
  const annualRecurring  = monthlyRecurring * 12;
  const oneTimeTotal     = oneTime.reduce((s,e) => s + (parseFloat(e.amount)||0), 0);
  // By category
  const byCategory = {};
  list.forEach(e => {
    const cat = e.category || 'Uncategorised';
    if (!byCategory[cat]) byCategory[cat] = {monthly:0, oneTime:0, count:0};
    byCategory[cat].count++;
    if (e.frequency === 'one-time' || !e.frequency) byCategory[cat].oneTime += parseFloat(e.amount)||0;
    else byCategory[cat].monthly += expenseMonthlyAmount(e);
  });
  return {recurring, oneTime, monthlyRecurring, annualRecurring, oneTimeTotal, byCategory};
}

function computeNetWorth(m) {
  if (!m) return {sgx:0,us:0,other:0,cpfTotal:0,srs:0,cash:0,otherAssets:0,liabilities:0,assets:0,netWorth:0,propEquity:0,propMortgage:0,propValue:0,liquid:0};
  const sgx  = (m.sgxHoldings  ||[]).reduce((s,h) => s + computeHolding(h,'sgx').valueSGD, 0);
  const us   = (m.usHoldings   ||[]).reduce((s,h) => s + computeHolding(h,'us').valueSGD,  0);
  const other= (m.otherHoldings||[]).reduce((s,h) => s + computeHolding(h,'other').valueSGD,0);
  const cpf  = m.cpf || {};
  const cpfTotal = (cpf.oa||0) + (cpf.sa||0) + (cpf.ma||0);
  const srs  = m.srs||0;
  const cash = computeCashTotal(m);
  const oa = m.otherAssets||0, liab = m.liabilities||0;
  const propStats = computeProperties(m);
  const propValue    = propStats.totalValue;
  const propMortgage = propStats.totalMortgage;
  const propEquity   = propStats.totalEquity;
  // Liquid = investable/accessible assets excluding property equity
  const liquid = sgx + us + other + cpfTotal + srs + cash;
  const assets = liquid + oa + propValue;  // gross assets (property at value, not equity)
  const liabilities = liab + propMortgage;
  const netWorth = assets - liabilities;
  return {
    sgx, us, other, cpfTotal, srs, cash, otherAssets:oa,
    propValue, propMortgage, propEquity,
    liquid, assets, liabilities, netWorth,
    investmentEquity: propStats.investmentEquity,
    primaryEquity: propStats.primaryEquity,
    rentalMonthly: propStats.totalRental,
    mtgMonthly: propStats.totalMtgPay,
    propCashFlow: propStats.totalCashFlow
  };
}

function computeFIRE(m) {
  const expense = m.fireAnnualExpense || 0;
  const rate    = (m.fireReturnRate  || 4) / 100;
  const fireNum = rate > 0 ? expense / rate : 0;
  const fireNum33 = expense > 0 ? expense / 0.03 : 0;  // 33× rule, 3% SWR
  const nw      = computeNetWorth(m);
  const current = nw.netWorth;
  // Liquid-only FIRE (most conservative — excludes property equity)
  const liquidCurrent = nw.liquid;
  const liquidPct = fireNum > 0 ? Math.min((liquidCurrent / fireNum) * 100, 999) : 0;
  // Post-sale FIRE (assumes investment property sold, equity becomes liquid)
  const postSaleCurrent = nw.liquid + nw.investmentEquity;
  const postSalePct = fireNum > 0 ? Math.min((postSaleCurrent / fireNum) * 100, 999) : 0;
  // Overall NW vs FIRE (includes all property equity)
  const pct     = fireNum > 0 ? Math.min((current / fireNum) * 100, 999) : 0;
  const gap     = Math.max(fireNum - current, 0);
  // SWR-based monthly income
  const swr4Monthly = liquidCurrent * 0.04 / 12;
  const swr3Monthly = liquidCurrent * 0.03 / 12;
  const postSaleSwr4 = postSaleCurrent * 0.04 / 12;
  const postSaleSwr3 = postSaleCurrent * 0.03 / 12;
  // Dividend income estimate (3.5% avg yield on equities, conservative)
  const equityValue = nw.sgx + nw.us + nw.other;
  const divMonthly = equityValue * 0.035 / 12;
  // Rental cash flow
  const rentalMonthly = nw.propCashFlow;
  // Years to FIRE (liquid only, assuming rate of return growth only)
  let years = null;
  if (fireNum > 0 && liquidCurrent < fireNum && rate > 0) {
    years = Math.log(fireNum / Math.max(liquidCurrent, 1)) / Math.log(1 + rate);
    if (years < 0 || !isFinite(years)) years = null;
  }
  return {
    fireNum, fireNum33, current, pct, gap, expense, rate, years,
    liquidCurrent, liquidPct,
    postSaleCurrent, postSalePct,
    swr4Monthly, swr3Monthly, postSaleSwr4, postSaleSwr3,
    divMonthly, rentalMonthly, equityValue,
    monthlyTarget: expense / 12
  };
}

// ── FORMATTERS ────────────────────────────────
function fmtSGD(n) {
  if (n === null || n === undefined || isNaN(n)) return 'S$—';
  const abs = Math.abs(n).toLocaleString('en-SG', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (n < 0 ? '-' : '') + 'S$' + abs;
}
function fmtCcy(n, ccy) {
  if (n === null || isNaN(n)) return '—';
  const sym = CCY_SYM[ccy] || ccy;
  const abs = Math.abs(n).toLocaleString('en', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (n < 0 ? '-' : '') + sym + abs;
}
function fmtPct(n, sign=true) {
  if (n === null || isNaN(n)) return '—';
  return (sign && n > 0 ? '+' : '') + n.toFixed(2) + '%';
}
function fmtNum(n, dp=0) {
  if (n === null || isNaN(n)) return '—';
  return n.toLocaleString('en', {minimumFractionDigits:dp, maximumFractionDigits:dp});
}
function fmtDate(d) {
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.toLocaleDateString('en-SG', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateShort(d) {
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.toLocaleDateString('en-SG', {day:'2-digit', month:'short'});
}
function pnlClass(n) { return n >= 0 ? 'pnl-pos' : 'pnl-neg'; }
function tip(text) {
  const safe = String(text).replace(/"/g, '&quot;').replace(/</g, '&lt;');
  return `<span class="tip-badge" title="${safe}" data-tip="${safe}" tabindex="0">?</span>`;
}

// Floating tooltip, appended to body so it never gets clipped by modals/overflow containers
(function initTooltips(){
  let tipEl = null;
  function ensure() {
    if (tipEl) return tipEl;
    tipEl = document.createElement('div');
    tipEl.id = 'global-tip';
    tipEl.style.cssText = 'position:fixed;display:none;z-index:99999;background:#242736;border:1px solid #363a50;border-radius:8px;padding:8px 12px;font-size:0.75rem;line-height:1.5;color:#9aa0b8;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,0.5);pointer-events:none;font-family:inherit';
    document.body.appendChild(tipEl);
    return tipEl;
  }
  function show(target) {
    const text = target.getAttribute('data-tip'); if (!text) return;
    const t = ensure();
    t.textContent = text;
    t.style.display = 'block';
    const r = target.getBoundingClientRect();
    // Position below by default, flip above if near bottom
    const vh = window.innerHeight;
    const tipH = t.offsetHeight;
    const tipW = t.offsetWidth;
    let top = r.bottom + 6;
    if (top + tipH > vh - 8) top = r.top - tipH - 6;
    let left = Math.max(8, Math.min(r.left, window.innerWidth - tipW - 8));
    t.style.top = top + 'px';
    t.style.left = left + 'px';
  }
  function hide() { if (tipEl) tipEl.style.display = 'none'; }
  document.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-tip]');
    if (t) show(t);
  });
  document.addEventListener('mouseout', e => {
    const t = e.target.closest('[data-tip]');
    if (t) hide();
  });
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tip]');
    if (t) { e.stopPropagation(); show(t); setTimeout(hide, 3000); }
    else hide();
  }, true);
  document.addEventListener('scroll', hide, true);
})();
function debounce(key, fn, ms=400) {
  clearTimeout(_debounceTimers[key]);
  _debounceTimers[key] = setTimeout(fn, ms);
}
function destroyChart(key) {
  if (_charts[key]) { try { _charts[key].destroy(); } catch(e){} _charts[key] = null; }
}

        <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <div class="card-title">Asset Allocation</div>
          <div class="alloc-toggle" role="tablist">
            <button class="alloc-toggle-btn ${STATE.ui.allocMode!=='net'?'active':''}" data-action="set-alloc-mode" data-mode="gross">Gross</button>
            <button class="alloc-toggle-btn ${STATE.ui.allocMode==='net'?'active':''}" data-action="set-alloc-mode" data-mode="net">Net</button>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="chart-alloc" height="220"></canvas></div>
        <div class="text-muted text-xs" style="padding:0 14px 8px;text-align:center">
          ${STATE.ui.allocMode==='net' ? 'Net view: property shown at equity (value – mortgage). Liabilities excluded.' : 'Gross view: total asset value. Mortgage shown as shaded overlay on property.'}
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">Breakdown</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
          ${(() => {
            const mode = STATE.ui.allocMode === 'net' ? 'net' : 'gross';
            if (mode === 'net') {
              const propEquity = Math.max(nw.propValue - nw.propMortgage, 0);
              const base = nw.netWorth || 1;
              return [
                allocRow('SGX Holdings', nw.sgx, base, '#d4af37'),
                allocRow('US Holdings',  nw.us,  base, '#58a6ff'),
                allocRow('Other Markets',nw.other,base,'#bc8cff'),
                allocRow('CPF Total',nw.cpfTotal,base,'#3fb950'),
                nw.srs>0?allocRow('SRS',nw.srs,base,'#56d364'):'',
                allocRow('Cash',nw.cash,base,'#ffa657'),
                propEquity>0?allocRow('Property (Equity)',propEquity,base,'#e05588'):'',
                nw.otherAssets>0?allocRow('Other Assets',nw.otherAssets,base,'#8b949e'):'',
                (nw.liabilities-nw.propMortgage)>0?allocRow('Other Liabilities (–)',nw.liabilities-nw.propMortgage,base,'#f85149'):''
              ].join('');
            }
            // Gross mode
            return [
              allocRow('SGX Holdings', nw.sgx, nw.assets, '#d4af37'),
              allocRow('US Holdings',  nw.us,  nw.assets, '#58a6ff'),
              allocRow('Other Markets',nw.other,nw.assets,'#bc8cff'),
              allocRow('CPF Total',nw.cpfTotal,nw.assets,'#3fb950'),
              nw.srs>0?allocRow('SRS',nw.srs,nw.assets,'#56d364'):'',
              allocRow('Cash',nw.cash,nw.assets,'#ffa657'),
              nw.propValue>0?allocRow('Property (Value)',nw.propValue,nw.assets,'#e05588'):'',
              nw.otherAssets>0?allocRow('Other Assets',nw.otherAssets,nw.assets,'#8b949e'):'',
              nw.propMortgage>0?allocRow('Property Mortgage (–)',nw.propMortgage,nw.assets,'#d97757'):'',
              (nw.liabilities-nw.propMortgage)>0?allocRow('Other Liabilities (–)',nw.liabilities-nw.propMortgage,nw.assets,'#f85149'):''
            ].join('');
          })()}
        </div>
      </div>
    </div>`;
  renderAllocationChart(m, nw);
}

function allocRow(label, val, total, color) {
  const pct = total > 0 ? (val / total * 100) : 0;
  return `<div style="display:flex;align-items:center;gap:10px">
    <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0"></div>
    <div style="flex:1;font-size:0.8rem">${label}</div>
    <div class="mono text-sm">${fmtSGD(val)}</div>
    <div class="text-muted text-xs" style="min-width:38px;text-align:right">${fmtPct(pct,false)}</div>
  </div>`;
}

// ── HOLDINGS TABLE ────────────────────────────
function tableToolbar(type, lastRefreshed, holdings) {
  const labels = {sgx:'SGX Holding',us:'US Holding',other:'Other Markets Holding'};
  const note = lastRefreshed ? `Updated ${fmtDate(lastRefreshed)}` : 'Prices not yet refreshed';
  // Collect unique brokers in this type's holdings
  const brokers = [...new Set((holdings||[]).map(h => h.broker).filter(Boolean))].sort();
  const currentFilter = STATE.ui.brokerFilter?.[type] || '';
  const filterHTML = brokers.length > 0 ? `
    <select class="form-select form-select-sm broker-filter" data-filter-type="${type}" style="min-width:140px;max-width:200px">
      <option value="">All Brokers (${holdings.length})</option>
      ${brokers.map(b => {
        const count = holdings.filter(h => h.broker === b).length;
        return `<option value="${esc(b)}"${currentFilter===b?' selected':''}>${esc(b)} (${count})</option>`;
      }).join('')}
      ${holdings.some(h => !h.broker) ? `<option value="__none__"${currentFilter==='__none__'?' selected':''}>No broker (${holdings.filter(h=>!h.broker).length})</option>` : ''}
    </select>` : '';
  return `<div class="table-toolbar">
    <button class="btn btn-primary btn-sm" data-action="add-${type}">+ Add ${labels[type]||'Holding'}</button>
    <button class="btn btn-ghost btn-sm" data-action="refresh-prices" data-type="${type}" id="refresh-btn-${type}">↻ Refresh Prices</button>
    ${filterHTML}
    <span class="refresh-note">${note}</span>
  </div>`;
}

const TIP_YAHOO = tip('Full Yahoo Finance symbol. SGX needs .SI suffix (e.g. D05.SI, Z74.SI). US is bare ticker (e.g. AAPL, SPY). HK uses .HK (e.g. 0700.HK). LSE uses .L (e.g. VWRL.L). If you enter a bare SGX code, the app will try to auto-append .SI for you.');
const TIP_UCITS = tip('UCITS ETFs (e.g. on LSE or Euronext) may have different tax treatment than US-domiciled ETFs. Consult a tax advisor for your jurisdiction.');

function holdingRow(h, type) {
  const cv = computeHolding(h, type);
  const priceDisplay = h.currentPrice > 0 ? fmtCcy(h.currentPrice, cv.ccy) : '<span class="text-muted">—</span>';
  const pnlDisplay   = cv.pnlSGD !== 0 || h.currentPrice > 0
    ? `<span class="${pnlClass(cv.pnlSGD)}">${fmtSGD(cv.pnlSGD)}</span>`
    : '<span class="text-muted">—</span>';
  const pnlPctDisplay = h.currentPrice > 0
    ? `<span class="${pnlClass(cv.pnlPct)}">${fmtPct(cv.pnlPct)}</span>`
    : '<span class="text-muted">—</span>';

  const ccyCol = type === 'other'
    ? `<td><span class="ccy-badge">${esc(h.currency||'USD')}</span></td>` : '';

  const brokerDisplay = h.broker
    ? `<span class="broker-badge">${esc(h.broker)}</span>`
    : '<span class="text-muted text-xs">—</span>';

  return `<tr>
    <td><span class="ticker-badge">${esc(h.ticker||'—')}</span></td>
    <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.name||'')}</td>
    <td>${brokerDisplay}</td>
    ${ccyCol}
    <td class="num">${fmtNum(h.shares, h.shares%1===0?0:4)}</td>
    <td class="num">${fmtCcy(h.avgCost, cv.ccy)}</td>
    <td class="num">${priceDisplay}</td>
    <td class="num bold">${fmtSGD(cv.valueSGD)}</td>
    <td class="num">${pnlDisplay}</td>
    <td class="num">${pnlPctDisplay}</td>
    <td class="actions">
      <button class="btn btn-icon" data-action="edit-holding" data-type="${type}" data-id="${h.id}" title="Edit">✏</button>
      <button class="btn btn-icon btn-danger" data-action="delete-holding" data-type="${type}" data-id="${h.id}" title="Delete">✕</button>
    </td>
  </tr>`;
}

function applyBrokerFilter(type, holdings) {
  const f = STATE.ui.brokerFilter?.[type];
  if (!f) return holdings;
  if (f === '__none__') return holdings.filter(h => !h.broker);
  return holdings.filter(h => h.broker === f);
}

function holdingsTableHTML(type, holdings) {
  const ccyHead = type === 'other' ? '<th>Ccy</th>' : '';
  const unitLabel = {sgx:'SGD',us:'USD',other:'Local'}[type] || '';
  const filtered = applyBrokerFilter(type, holdings);
  const filterNote = filtered.length !== holdings.length
    ? `<div class="filter-note">Showing ${filtered.length} of ${holdings.length} holdings <button class="btn-link-inline" data-action="clear-broker-filter" data-type="${type}">clear filter</button></div>`
    : '';
  const rows = filtered.length > 0
    ? filtered.map(h => holdingRow(h, type)).join('')
    : holdings.length > 0
      ? `<tr><td colspan="${type==='other'?11:10}" style="padding:24px;text-align:center;color:var(--text3)">No holdings match the selected broker.</td></tr>`
      : `<tr><td colspan="${type==='other'?11:10}" style="padding:0">${emptyState('📭','No holdings yet','Add your first position using the button above.',null,null)}</td></tr>`;
  return `${filterNote}<div class="table-wrap">
    <table class="holdings-table">
      <thead><tr>
        <th>Symbol</th><th>Name</th><th>Broker</th>${ccyHead}
        <th class="num">Shares</th>
        <th class="num">Avg Cost (${unitLabel})</th>
        <th class="num">Price (${unitLabel})</th>
        <th class="num">Value (SGD)</th>
        <th class="num">P&amp;L (SGD)</th>
        <th class="num">P&amp;L %</th>
        <th class="actions">Actions</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function holdingsTotalsRow(holdings, type) {
  const filtered = applyBrokerFilter(type, holdings);
  if (!filtered.length) return '';
  const totalVal  = filtered.reduce((s,h) => s + computeHolding(h,type).valueSGD, 0);
  const totalPnL  = filtered.reduce((s,h) => s + computeHolding(h,type).pnlSGD,  0);
  const totalCost = filtered.reduce((s,h) => s + computeHolding(h,type).costSGD,  0);
  const totalPct  = totalCost > 0 ? (totalPnL / totalCost * 100) : 0;
  const label = filtered.length !== holdings.length
    ? `Filtered Total (${filtered.length} of ${holdings.length})`
    : `Total`;
  return `<div style="display:flex;justify-content:flex-end;gap:24px;padding:10px 4px;font-size:0.8rem;flex-wrap:wrap">
    <span class="text-muted">${label} Value: <span class="mono bold text-gold">${fmtSGD(totalVal)}</span></span>
    <span class="text-muted">${label} P&amp;L: <span class="mono ${pnlClass(totalPnL)}">${fmtSGD(totalPnL)} (${fmtPct(totalPct)})</span></span>
  </div>`;
}

function renderPropertiesView() {
  const el = document.getElementById('view-properties'); if (!el) return;
  const m = getActiveMember();
  if (!m) { el.innerHTML = emptyState('👤','No Member Selected','Select a member from the sidebar.',null,null); return; }
  const props = m.properties || [];
  const stats = computeProperties(m);
  const typeLabel = {primary:'🏡 Primary Home', investment:'🏢 Investment', vacation:'🏖 Vacation', commercial:'🏬 Commercial', other:'🏠 Other'};

  const tipShare = tip('Your ownership percentage. If you own 50% jointly with your spouse, enter 50. Property equity and cash flow are scaled by this share.');
  const tipType = tip('Primary home is typically excluded from FIRE calculations (you need somewhere to live). Investment properties can be sold and their equity becomes liquid — this is tracked as a post-sale FIRE scenario.');
  const tipCPFInProp = tip('If you used CPF OA to purchase this property, that CPF amount is already reflected in the property equity — DON\'T also count it in your CPF accounts balance to avoid double-counting.');

  const rows = props.length ? props.map(p => {
    const share = (p.ownershipPct != null ? p.ownershipPct : 100) / 100;
    const userValue = (p.value||0) * share;
    const userMortgage = (p.mortgage||0) * share;
    const equity = userValue - userMortgage;
    const cf = ((p.monthlyRental||0) - (p.monthlyMortgage||0) - (p.monthlyCosts||0)) * share;
    return `<tr>
      <td>
        <div style="font-weight:600">${esc(p.name||'—')}</div>
        <div class="text-muted text-xs">${typeLabel[p.type]||p.type||'—'}${p.location?' · '+esc(p.location):''}</div>
      </td>
      <td class="num">${fmtSGD(p.value||0)}</td>
      <td class="num">${p.ownershipPct != null ? fmtNum(p.ownershipPct,0)+'%' : '100%'}</td>
      <td class="num">${fmtSGD(userValue)}</td>
      <td class="num text-red">${userMortgage>0?fmtSGD(userMortgage):'—'}</td>
      <td class="num bold" style="color:var(--gold)">${fmtSGD(equity)}</td>
      <td class="num"><span class="${cf>=0?'pnl-pos':'pnl-neg'}">${fmtSGD(cf)}/mo</span></td>
      <td class="actions">
        <button class="btn btn-icon" data-action="edit-property" data-id="${p.id}" title="Edit">✏</button>
        <button class="btn btn-icon btn-danger" data-action="delete-property" data-id="${p.id}" title="Delete">✕</button>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="8" style="padding:0">${emptyState('🏠','No properties yet','Add your first property to track value, mortgage, rental income, and FIRE scenarios.','add-property','Add Property')}</td></tr>`;

  const totalsRow = props.length ? `<tr style="background:var(--bg3);font-weight:600;border-top:2px solid var(--gold)">
    <td style="color:var(--gold)">TOTAL (Your Share)</td>
    <td class="num">${fmtSGD(stats.totalValue / (props.reduce((s,p)=>s+((p.ownershipPct!=null?p.ownershipPct:100)/100),0)/props.length||1))}</td>
    <td></td>
    <td class="num">${fmtSGD(stats.totalValue)}</td>
    <td class="num text-red">${fmtSGD(stats.totalMortgage)}</td>
    <td class="num bold" style="color:var(--gold)">${fmtSGD(stats.totalEquity)}</td>
    <td class="num"><span class="${stats.totalCashFlow>=0?'pnl-pos':'pnl-neg'}">${fmtSGD(stats.totalCashFlow)}/mo</span></td>
    <td></td>
  </tr>` : '';

  el.innerHTML = `
    <div class="view-header">
      <div>
        <h2 class="view-title">🏠 Properties</h2>
        <div class="text-muted text-sm">Residential, investment, commercial — tracked with ownership share and cash flow</div>
      </div>
      <button class="btn btn-primary btn-sm" data-action="add-property">+ Add Property</button>
    </div>

    ${props.length === 0 ? '' : `<div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Property Value (Your Share)</div>
        <div class="stat-value big">${fmtSGD(stats.totalValue)}</div>
        <div class="stat-sub">${props.length} propert${props.length===1?'y':'ies'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Mortgage</div>
        <div class="stat-value" style="color:var(--red)">${fmtSGD(stats.totalMortgage)}</div>
        <div class="stat-sub">Outstanding loans</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Net Equity</div>
        <div class="stat-value" style="color:var(--gold)">${fmtSGD(stats.totalEquity)}</div>
        <div class="stat-sub">Value − Mortgage</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Monthly Cash Flow</div>
        <div class="stat-value ${stats.totalCashFlow>=0?'':'text-red'}">${fmtSGD(stats.totalCashFlow)}</div>
        <div class="stat-sub">Rental − mortgage − costs</div>
      </div>
      ${stats.investmentEquity>0 ? `<div class="stat-card">
        <div class="stat-label">Investment Equity</div>
        <div class="stat-value" style="color:var(--blue)">${fmtSGD(stats.investmentEquity)}</div>
        <div class="stat-sub">Excludes primary home — can become liquid on sale</div>
      </div>` : ''}
    </div>`}

    <div class="hint-banner">
      <span class="hint-icon">💡</span>
      <div class="hint-content">
        <div class="hint-text"><strong>Avoiding double-counting:</strong> If you used CPF OA to buy this property, the CPF funds are captured in the property equity here — do <strong>not</strong> also include them in your CPF balance. Similarly, "Other Assets" on the Dashboard is separate from property; use that only for things like cars, jewellery, crypto, private equity, etc.</div>
      </div>

    <div class="table-wrap section-gap">
      <table class="holdings-table">
        <thead><tr>
          <th>Property</th>
          <th class="num">Total Value ${tipShare}</th>
          <th class="num">Your %</th>
          <th class="num">Your Share</th>
          <th class="num">Your Mortgage</th>

          <th class="num">Cash Flow</th>
          <th class="actions">Actions</th>
        </tr></thead>
        <tbody>${rows}${totalsRow}</tbody>
      </table>
    </div>`;
}

// Create a striped diagonal pattern on top of a base color (for mortgage overlay)
function makeStripePattern(baseColor, stripeColor) {
  const canvas = document.createElement('canvas');
  canvas.width = 10; canvas.height = 10;
  const pctx = canvas.getContext('2d');
  pctx.fillStyle = baseColor;
  pctx.fillRect(0, 0, 10, 10);
  pctx.strokeStyle = stripeColor;
  pctx.lineWidth = 2;
  pctx.beginPath();
  pctx.moveTo(-2, 12); pctx.lineTo(12, -2);
  pctx.moveTo(3, 12);  pctx.lineTo(12, 3);
  pctx.moveTo(-2, 7);  pctx.lineTo(7, -2);
  pctx.stroke();
  return pctx.createPattern(canvas, 'repeat');
}

if (!primaryData) {
// User cleared it — remove existing primary if any
if (existingIdx >= 0) m.properties.splice(existingIdx, 1);

}
if (existingIdx >= 0) {
// Update existing, preserving the id
m.properties[existingIdx] = {...m.properties[existingIdx], ...primaryData};
} else {
// Add new primary property
m.properties.push({id: uid(), ...primaryData});
}
}

const CORS_PROXIES = [
url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
url => `https://cors-anywhere.com/${url}`,
url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

// Map our ticker format to Stooq’s ticker format.
// Stooq uses suffixes like “.us”, “.uk”, “.jp”, “.hk” (lowercase), and no suffix for its native PL market.
function toStooqSymbol(ticker, type) {
if (!ticker) return null;
const t = ticker.toUpperCase().trim();
// US tickers (no dot or .US): AAPL -> aapl.us
if (type === ‘us’) {
const bare = t.split(’.’)[0].replace(/-/g, ‘.’);  // BRK-B → brk.b on stooq
return bare.toLowerCase() + ‘.us’;
}
// Other markets — translate Yahoo suffix to Stooq suffix
if (t.endsWith(’.HK’)) return t.replace(’.HK’, ‘.hk’).toLowerCase();
if (t.endsWith(’.L’))  return t.replace(’.L’,  ‘.uk’).toLowerCase();
if (t.endsWith(’.T’))  return t.replace(’.T’,  ‘.jp’).toLowerCase();
if (t.endsWith(’.AX’)) return t.replace(’.AX’, ‘.au’).toLowerCase();
if (t.endsWith(’.TO’)) return t.replace(’.TO’, ‘.ca’).toLowerCase();
if (t.endsWith(’.DE’)) return t.replace(’.DE’, ‘.de’).toLowerCase();
// SGX — Stooq has very limited SGX coverage; skip it
if (type === ‘sgx’ || t.endsWith(’.SI’)) return null;
return null;
}

// Fetch from Stooq CSV endpoint (no auth needed). Returns {price, name, currency} or null.
async function fetchQuoteStooq(ticker, type) {
const sym = toStooqSymbol(ticker, type);
if (!sym) return null;
// Stooq CSV format: Symbol,Date,Time,Open,High,Low,Close,Volume
const url = `https://stooq.com/q/l/?s=${encodeURIComponent(sym)}&f=sd2t2ohlcv&h&e=csv`;
for (const makeProxyUrl of CORS_PROXIES) {
try {
const r = await fetch(makeProxyUrl(url), { signal: AbortSignal.timeout(10000) });
if (!r.ok) continue;
const text = await r.text();
// Parse CSV: first line = header, second = data
const lines = text.trim().split(’\n’);
if (lines.length < 2) continue;
const cols = lines[1].split(’,’);
// Col 6 = Close price (fields: sd2t2ohlcv → symbol, date, time, open, high, low, close, volume)
const priceStr = cols[6];
if (!priceStr || priceStr === ‘N/D’) continue;
const price = parseFloat(priceStr);
if (isNaN(price) || price <= 0) continue;
return {
price,
name: ‘’,       // Stooq doesn’t return company name in this endpoint
currency: null, // Stooq doesn’t return currency either
source: ‘stooq’
};
} catch (e) { continue; }
}
return null;
}

// Fetch from Finnhub (requires free API key). Returns {price, name, currency} or null.
async function fetchQuoteFinnhub(ticker, type) {
const key = localStorage.getItem(PFX + ‘finnhubKey’);
if (!key) return null;
// Finnhub symbol format for SGX: “SGX:D05” (no .SI suffix) — but coverage is limited on free tier.
// For US: bare ticker.
// Finnhub doesn’t reliably support most non-US on free tier, so we only try US.
if (type !== ‘us’) return null;
const bare = ticker.toUpperCase().split(’.’)[0].replace(/-/g, ‘.’);
const url = `https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(bare)}&token=${encodeURIComponent(key)}`;
try {
const r = await fetch(url, { signal: AbortSignal.timeout(10000) });
if (!r.ok) return null;
const j = await r.json();
// Finnhub returns { c: current, h: high, l: low, o: open, pc: prevClose, t: timestamp }
if (j?.c && j.c > 0) {
return { price: j.c, name: ‘’, currency: ‘USD’, source: ‘finnhub’ };
}
} catch (e) { /* ignore */ }
return null;
}

// Main price fetcher — tries Yahoo first (primary, has company name), then Stooq, then Finnhub if configured
async function fetchQuote(ticker) {
if (!ticker) return null;
const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=1d`;
for (const makeProxyUrl of CORS_PROXIES) {
try {
const r = await fetch(makeProxyUrl(url), { signal: AbortSignal.timeout(10000) });
if (!r.ok) continue;
const text = await r.text();
let j;
try { j = JSON.parse(text); } catch { continue; }
const meta = j?.chart?.result?.[0]?.meta;
const price = meta?.regularMarketPrice;
if (price != null && price > 0) {
return {
price,
name: meta?.longName || meta?.shortName || ‘’,
currency: meta?.currency || null,
exchange: meta?.exchangeName || meta?.fullExchangeName || null,
source: ‘yahoo’
};
}
} catch (e) { continue; }
}
return null;
}

// Backward-compat: fetchPrice returns just the number
async function fetchPrice(ticker) {
const q = await fetchQuote(ticker);
return q ? q.price : null;
}

// Try the ticker as given, then auto-append an appropriate suffix for the holdings type
async function fetchQuoteSmart(ticker, type) {
if (!ticker) return {quote:null, usedTicker:null};
const clean = ticker.trim().toUpperCase();

// Helper: try every data source for a given symbol
async function tryAllSources(sym) {
let q = await fetchQuote(sym);
if (q) return q;
q = await fetchQuoteStooq(sym, type);
if (q) return q;
q = await fetchQuoteFinnhub(sym, type);
if (q) return q;
return null;
}

// 1. Try as-is
let q = await tryAllSources(clean);
if (q) return {quote:q, usedTicker: clean};

// 2. SGX — auto-append .SI if no suffix
if (type === ‘sgx’ && !clean.includes(’.’)) {
const trySI = clean + ‘.SI’;
q = await tryAllSources(trySI);
if (q) return {quote:q, usedTicker: trySI};
}

// 3. US — strip accidental suffix
if (type === ‘us’ && clean.includes(’.’)) {
const bare = clean.split(’.’)[0];
q = await tryAllSources(bare);
if (q) return {quote:q, usedTicker: bare};
}
// 3b. US — swap . for - (BRK.B → BRK-B)
if (type === ‘us’ && clean.includes(’.’)) {
const withDash = clean.replace(/./g, ‘-’);
q = await tryAllSources(withDash);
if (q) return {quote:q, usedTicker: withDash};
}

// 4. Other Markets — try common suffix guesses
if (type === ‘other’ && !clean.includes(’.’)) {
const guesses = [];
if (/^\d{1,5}$/.test(clean)) guesses.push(clean.padStart(4, ‘0’) + ‘.HK’);
guesses.push(clean + ‘.L’, clean + ‘.AX’, clean + ‘.TO’);
for (const g of guesses) {
q = await tryAllSources(g);
if (q) return {quote:q, usedTicker: g};
}
}

return {quote:null, usedTicker: clean};
}
async function fetchPriceSmart(ticker, type) {
const {quote, usedTicker} = await fetchQuoteSmart(ticker, type);
return {price: quote?.price ?? null, usedTicker};
}

async function refreshAllPrices(type) {
const m = getActiveMember(); if (!m) return;
const arr = m[holdingsKey(type)];
if (!arr.length) { showToast(‘No holdings to refresh.’, ‘info’); return; }
const btn = document.getElementById(‘refresh-btn-’ + type);
if (btn) { btn.disabled = true; btn.textContent = ‘↻ Refreshing...’; }
let ok = 0;
const failed = [];           // tickers that couldn’t be resolved
const autoFixed = [];        // tickers where we auto-appended .SI successfully
for (const h of arr) {
if (!h.ticker) { failed.push({ticker: h.name||’?’, reason:‘empty’}); continue; }
const result = await fetchPriceSmart(h.ticker, type);
if (result.price !== null) {
h.currentPrice = result.price;
h.lastRefreshed = new Date().toISOString();
if (result.usedTicker !== h.ticker) {
// Auto-fixed by appending suffix — persist the corrected ticker
autoFixed.push({old: h.ticker, fixed: result.usedTicker});
h.ticker = result.usedTicker;
}
ok++;
} else {
failed.push({ticker: h.ticker, reason: diagnoseTickerIssue(h.ticker, type)});
}
await new Promise(r => setTimeout(r, 250));
}
saveMembers();
if (btn) { btn.disabled = false; btn.textContent = ‘↻ Refresh Prices’; }
// Build the result toast
if (ok === arr.length) {
let msg = `✓ Updated ${ok} price${ok!==1?'s':''}`;
if (autoFixed.length) msg += ` (auto-fixed ${autoFixed.length}: ${autoFixed.slice(0,2).map(f => f.old+'→'+f.fixed).join(', ')}${autoFixed.length>2?'...':''})`;
showToast(msg, ‘success’);
} else if (ok === 0) {
// All failed — open a modal with detailed hints
showRefreshFailedModal(failed, type);
} else {
// Partial success — show compact message, then detailed modal button
const failedList = failed.slice(0,3).map(f => f.ticker).join(’, ’);
showToast(`Updated ${ok}/${arr.length}. ${failed.length} failed: ${failedList}${failed.length>3?'...':''}`, ‘info’);
// Show modal for details if SGX (most common issue)
if (type === ‘sgx’ && failed.some(f => f.reason === ‘no-suffix’)) {
setTimeout(() => showRefreshFailedModal(failed, type), 800);
}
}
renderView();
}

function diagnoseTickerIssue(ticker, type) {
const t = (ticker || ‘’).toUpperCase();
if (type === ‘sgx’) {
if (!t.includes(’.’)) return ‘no-suffix’;  // missing .SI
if (!t.endsWith(’.SI’)) return ‘wrong-suffix’;
return ‘not-found’;
}
if (type === ‘us’) {
if (t.includes(’.’)) return ‘us-has-suffix’;
return ‘not-found’;
}
if (type === ‘other’) {
if (!t.includes(’.’)) return ‘other-no-suffix’;
return ‘not-found’;
}
return ‘not-found’;
}

if (document.getElementById(‘ai-remember-key’)?.checked) localStorage.setItem(PFX + ‘anthropicKey’, key);

})
});

// Minimal markdown renderer for AI output
function renderMarkdown(md) {
let html = esc(md);
html = html.replace(/^### (.+)$/gm, ‘<h4 style="color:var(--gold);margin:14px 0 6px;font-size:0.95rem">$1</h4>’);
html = html.replace(/^## (.+)$/gm,  ‘<h3 style="color:var(--text);margin:16px 0 8px;font-family:var(--font-d);font-size:1.1rem">$1</h3>’);
html = html.replace(/^# (.+)$/gm,   ‘<h2 style="color:var(--text);margin:18px 0 10px;font-family:var(--font-d);font-size:1.25rem">$1</h2>’);
html = html.replace(/\*\*(.+?)\*\*/g, ‘<strong style="color:var(--text)">$1</strong>’);
html = html.replace(/*(.+?)*/g, ‘<em>$1</em>’);
html = html.replace(/`([^`]+)`/g, '<code style="color:var(--gold);background:var(--bg2);padding:1px 5px;border-radius:3px;font-size:0.82em">$1</code>'); html = html.replace(/^---+$/gm, '<hr style="border:none;border-top:1px solid var(--border);margin:12px 0">'); html = html.replace(/^(\s*)[-*] (.+)$/gm, '$1<li>$2</li>'); html = html.replace(/^(\s*)\d+\. (.+)$/gm, '$1<li>$2</li>'); html = html.replace(/(<li>.+?<\/li>\n?)+/gs, m => '<ul style="margin:6px 0 10px 20px;padding:0;color:var(--text2)">' + m + '</ul>'); html = html.split(/\n\n+/).map(p => p.match(/^<(h\d|ul|hr|li|pre)/) ? p : `<p style="margin:6px 0;color:var(--text2);line-height:1.65">${p.replace(/\n/g, ‘<br>’)}</p>`).join(’’);
return html;
}

function renderWizardStep() {

const dots = Array.from({length: WIZARD_STEPS.length}, (_, i) => {

return `<div class="${cls}" data-action="wizard-goto" data-step="${i+1}"></div>`;
}).join(’’);
document.getElementById(‘wiz-dots’).innerHTML = dots;
}
